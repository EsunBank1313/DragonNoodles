<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-size="20" font-weight="900" text-anchor="middle">💰 抽屜現金盤點計算機與短溢對帳公式</text>

  <rect x="40" y="55" width="820" height="160" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>

  <!-- Step 1: Denominations -->
  <rect x="60" y="75" width="220" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="170" y="100" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">1. 點鈔機各面額張數</text>
  <text x="170" y="125" fill="#cbd5e1" font-size="11" text-anchor="middle">1000 / 500 / 100 / 50 / 10 / 5 / 1</text>
  <text x="170" y="160" fill="#f8fafc" font-size="15" font-weight="900" text-anchor="middle">= 抽屜總現金 (例 $13,500)</text>

  <!-- Minus Sign -->
  <text x="300" y="140" fill="#ef4444" font-size="28" font-weight="900" text-anchor="middle">-</text>

  <!-- Step 2: Petty Cash -->
  <rect x="320" y="75" width="220" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="430" y="100" fill="#fb923c" font-size="13" font-weight="bold" text-anchor="middle">2. 開/收店零錢備用金</text>
  <text x="430" y="125" fill="#cbd5e1" font-size="11" text-anchor="middle">固定零錢底金 (不計入營收)</text>
  <text x="430" y="160" fill="#fb923c" font-size="15" font-weight="900" text-anchor="middle">底金 (例 $3,000)</text>

  <!-- Equal Sign -->
  <text x="560" y="140" fill="#10b981" font-size="28" font-weight="900" text-anchor="middle">=</text>

  <!-- Step 3: Result -->
  <rect x="580" y="75" width="260" height="120" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="710" y="100" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">3. 現金營業額實收</text>
  <text x="710" y="125" fill="#f8fafc" font-size="14" font-weight="900" text-anchor="middle">實收 $10,500 ⟷ 系統 $10,500</text>
  <rect x="620" y="145" width="180" height="30" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="710" y="165" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">🟢 差額 $0 (完美吻合)</text>
</svg>