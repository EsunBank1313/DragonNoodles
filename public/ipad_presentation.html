                <h4 class="text-sm font-bold text-emerald-400 mb-3 flex items-center gap-1.5">
                  <span>✅</span> 智膳 AI 導入後效益
                </h4>
                <ul class="text-xs text-slate-300 space-y-2">
                  <li>✓ 雙外送全自動出單切單 ➔ 節省 100% 顧單時間</li>
                  <li>✓ 貼袋單備註反白加粗 ➔ 客製出錯率降至 0</li>
                  <li>✓ 辦公室 LINE 揪團對帳 ➔ 午間與下午茶大單暴增 30%+</li>
                  <li class="font-bold text-emerald-400 pt-1">導入第 1 個月立即收回投資！</li>
                </ul>
              </div>
            </div>

            <div class="mt-6 pt-5 border-t border-slate-700/80 flex flex-col md:flex-row items-center justify-between gap-4">
              <div class="text-xs text-slate-400">
                ★ 歡迎預約現場門市實機示範！(體驗雙外送秒級自動出單)
              </div>
              <div class="text-sm font-bold text-amber-400">
                專屬諮詢專線：09xx-xxx-xxx ｜ LINE：@smartbite_pos
              </div>
            </div>
          </div>
        `
      }
    ];

    // State
    let currentIndex = 0;
    let isPlaying = true;
    let isVoiceEnabled = true;
    let slideSeconds = 14;
    let remainingTime = slideSeconds;
    let intervalTimer = null;
    let isSpeaking = false;

    // Elements
    const slideContainer = document.getElementById('slideContainer');
    const slideDots = document.getElementById('slideDots');
    const progressBar = document.getElementById('progressBar');
    const slideIndexLabel = document.getElementById('slideIndexLabel');
    const timerLabel = document.getElementById('timerLabel');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const playPauseText = document.getElementById('playPauseText');
    const btnVoiceToggle = document.getElementById('btnVoiceToggle');
    const voiceIcon = document.getElementById('voiceIcon');
    const voiceStatusText = document.getElementById('voiceStatusText');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const chkAutoLoop = document.getElementById('chkAutoLoop');
    const narrationText = document.getElementById('narrationText');
    const startOverlay = document.getElementById('startOverlay');
    const btnStartPresentation = document.getElementById('btnStartPresentation');

    // Initialize Indicators
    function renderDots() {
      slideDots.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="w-2.5 h-2.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-8 bg-orange-400' : 'bg-slate-600 hover:bg-slate-500'}"></button>
      `).join('');
    }

    // Render Current Slide
    function renderSlide() {
      const slide = slides[currentIndex];
      slideContainer.classList.remove('slide-enter');
      void slideContainer.offsetWidth; // trigger reflow
      slideContainer.classList.add('slide-enter');

      slideContainer.innerHTML = `
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <span class="px-3 py-1 rounded-full text-xs font-black bg-gradient-to-r ${slide.color} text-slate-950 uppercase tracking-wider">
              ${slide.tag}
            </span>
            <span class="text-xs text-slate-400 font-mono">SLIDE ${String(slide.id).padStart(2, '0')}</span>
          </div>
          <h2 class="text-2xl md:text-4xl font-black text-white leading-tight">
            ${slide.title}
          </h2>
          <p class="text-sm md:text-base text-slate-400 font-medium">
            ${slide.subtitle}
          </p>
        </div>

        ${slide.contentHtml}
      `;

      slideIndexLabel.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      narrationText.textContent = slide.narration;
      renderDots();

      // Trigger Voice
      if (isVoiceEnabled) {
        speakNarration(slide.narration);
      }
    }

    // Speech Synthesis
    function speakNarration(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 1.05; // Slightly lively presentation pace
      utterance.pitch = 1.0;

      // Select Best Chinese Voice
      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW') || v.name.includes('Taiwan') || v.name.includes('Mei-Jia') || v.name.includes('HanHan'));
      if (twVoice) utterance.voice = twVoice;

      utterance.onstart = () => { isSpeaking = true; };
      utterance.onend = () => { isSpeaking = false; };
      utterance.onerror = () => { isSpeaking = false; };

      window.speechSynthesis.speak(utterance);
    }

    // Timer & Auto-play Engine
    function startTimer() {
      clearInterval(intervalTimer);
      remainingTime = slideSeconds;

      intervalTimer = setInterval(() => {
        if (!isPlaying) return;

        remainingTime -= 0.1;
        const progressPercent = ((slideSeconds - remainingTime) / slideSeconds) * 100;
        progressBar.style.width = `${Math.min(100, Math.max(0, progressPercent))}%`;
        timerLabel.textContent = `剩餘 ${Math.ceil(remainingTime)}s`;

        if (remainingTime <= 0) {
          // If voice is still speaking, wait a little bit
          if (isSpeaking && isVoiceEnabled) {
            remainingTime = 1;
            return;
          }
          nextSlide();
        }
      }, 100);
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide();
        remainingTime = slideSeconds;
      } else if (chkAutoLoop.checked) {
        currentIndex = 0;
        renderSlide();
        remainingTime = slideSeconds;
      } else {
        pause();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
        remainingTime = slideSeconds;
      }
    }

    window.goToSlide = function(index) {
      currentIndex = index;
      renderSlide();
      remainingTime = slideSeconds;
    };

    function play() {
      isPlaying = true;
      playPauseIcon.textContent = "⏸️";
      playPauseText.textContent = "暫停";
    }

    function pause() {
      isPlaying = false;
      playPauseIcon.textContent = "▶️";
      playPauseText.textContent = "播放";
      if ('speechSynthesis' in window) window.speechSynthesis.pause();
    }

    btnPlayPause.addEventListener('click', () => {
      if (isPlaying) {
        pause();
      } else {
        play();
        if ('speechSynthesis' in window && window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
      }
    });

    btnPrev.addEventListener('click', prevSlide);
    btnNext.addEventListener('click', nextSlide);

    // Voice Toggle
    btnVoiceToggle.addEventListener('click', () => {
      isVoiceEnabled = !isVoiceEnabled;
      if (isVoiceEnabled) {
        btnVoiceToggle.className = "px-3 py-1.5 rounded-full text-xs font-bold border transition flex items-center gap-1.5 bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
        voiceIcon.textContent = "🔊";
        voiceStatusText.textContent = "語音導覽：開";
        speakNarration(slides[currentIndex].narration);
      } else {
        btnVoiceToggle.className = "px-3 py-1.5 rounded-full text-xs font-bold border transition flex items-center gap-1.5 bg-slate-700/50 text-slate-400 border-slate-600";
        voiceIcon.textContent = "🔇";
        voiceStatusText.textContent = "語音導覽：關";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    });

    // Fullscreen Support
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // iPad Start Presentation Unlock
    btnStartPresentation.addEventListener('click', () => {
      startOverlay.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => startOverlay.remove(), 400);

      // Unlock Audio & Start
      if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(dummy);
      }

      renderSlide();
      startTimer();
      play();
    });

    // Keyboard Navigation for wireless clickers
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      }
    });

    // Preload voices
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
